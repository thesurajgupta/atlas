# ATLAS gitleaks configuration (ADR-010).
[extend]
useDefault = true

[allowlist]
description = "Paths and deliberate placeholders that are not secrets"
# Match against the whole source line, not the extracted secret fragment.
# Without this, a regex describing the surrounding code can never match,
# because gitleaks only offers the high-entropy substring it isolated.
regexTarget = "line"
paths = [
  '''\.venv/''',
  '''node_modules/''',
  '''\.git/''',
  '''docs/archive/''',
  # Next.js build output. `.next/cache/.previewinfo` and `.rscinfo` hold
  # locally-generated random tokens that gitleaks reads as API keys. It is
  # generated, gitignored, and never committed — but the working-tree scan
  # reads gitignored files, so without this every frontend developer gets
  # "SECRET FOUND IN WORKING TREE" the first time they run a build.
  #
  # Excluding generated output is not weakening the check (CLAUDE.md rule 1):
  # apps/web source is still scanned, and a scanner that cries wolf on every
  # build is one people learn to ignore.
  '''apps/web/\.next/''',
]
regexes = [
  '''change-me-locally''',
  '''generate-a-random-value-locally.*''',
  # Browser storage keys. `const STORAGE_KEY = 'atlas.ncrp.complaint.v2'` is a
  # `localStorage` key — a name, visible in devtools by design, carrying no
  # authority at all — but it is a long dotted string, so the generic-api-key
  # rule reads it as high entropy.
  #
  # Narrow on purpose: it matches only a `STORAGE_KEY` (or `_KEY`) constant
  # whose value begins `atlas.` and holds nothing but dotted lowercase
  # segments. A real credential cannot take that shape, so this does not widen
  # the hole for anything else (CLAUDE.md rule 1).
  '''(?i)_KEY\s*=\s*['"]atlas(\.[a-z0-9-]+)+['"]''',
]
