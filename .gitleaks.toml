# ATLAS gitleaks configuration (ADR-010).
[extend]
useDefault = true

[allowlist]
description = "Paths and deliberate placeholders that are not secrets"
# Match against the whole source line, not the extracted secret fragment.
# Without this, a regex describing the surrounding code can never match,
# because gitleaks only offers the high-entropy substring it isolated.
regexTarget = "line"
paths = [
  '''\.venv/''',
  '''node_modules/''',
  '''\.git/''',
  '''docs/archive/''',
]
regexes = [
  '''change-me-locally''',
  '''generate-a-random-value-locally.*''',
]
