[pytest]
# Single source of truth for test configuration. Lives at the repo root because
# tests/ sits here, not under apps/api — two configs meant markers silently went
# unregistered and `-m leakage` selected nothing.
testpaths = tests
pythonpath = apps/api
asyncio_mode = auto
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning:atlas.*
    # Starlette's TestClient warns about httpx on every use. It is a dependency's
    # deprecation, not ours, and the noise would hide warnings we can act on.
    ignore:Using .httpx. with .starlette.testclient.

markers =
    leakage: ground-truth leakage gates (spec §19) — must never be skipped
    security: security control tests
    fairness: prohibited-feature and disparity tests
    db: requires a running PostgreSQL
    slow: excluded from the fast pre-push loop
