name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Gate 1: the repository must be safe to publish. Runs first and alone,
  # because nothing else matters if a secret has leaked (ADR-010).
  # ---------------------------------------------------------------------
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history — a removed secret is still a secret
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: .env must not be tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked. Remove it and rotate every value in it."
            exit 1
          fi

  # ---------------------------------------------------------------------
  # Gate 2: documentation integrity. Cheap, and catches spec drift early.
  # ---------------------------------------------------------------------
  docs:
    name: Spec & traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/check_spec_refs.py
      - run: python scripts/check_traceability.py
      - run: python scripts/check_dependencies.py
      - run: python scripts/check_ai_context.py

  # ---------------------------------------------------------------------
  # Gate 3: infrastructure definitions are valid.
  # ---------------------------------------------------------------------
  compose:
    name: Compose validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  # ---------------------------------------------------------------------
  # Detect whether Python sources exist yet.
  #
  # Until Phase 1 lands there is no application code, and tools that are
  # correct on a populated repo fail on an empty one: mypy exits 2 with no
  # files, pytest exits 5 when it collects no tests. Gating on the presence
  # of a pyproject.toml was not enough — the file exists before the code
  # does. Gate on actual .py files instead, mirroring the Makefile.
  # ---------------------------------------------------------------------
  detect:
    name: Detect sources
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.d.outputs.python }}
      tests: ${{ steps.d.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          if [ -n "$(find apps/api simulator ml -name '*.py' -not -path '*/.*' 2>/dev/null | head -1)" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No Python sources yet::Skipping lint, types, tests and SAST until Phase 1 lands."
          fi
          if [ -n "$(find tests -name 'test_*.py' 2>/dev/null | head -1)" ]; then
            echo "tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------
  # Gate 4: code quality.
  # ---------------------------------------------------------------------
  quality:
    name: Lint, types, module boundaries
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "apps/api[dev]"
      - run: ruff check apps/api simulator ml tests
      - run: ruff format --check apps/api simulator ml tests
      # simulator and ml live outside apps/api: without MYPYPATH and an
      # explicit config, mypy resolves neither `atlas.*` nor the strict
      # settings, and reports success on code it barely checked.
      - run: make typecheck
      - name: Module boundaries (ADR-009)
        run: lint-imports

  # ---------------------------------------------------------------------
  # Gate 5: tests, including the honesty gates.
  #
  # These must never silently skip once implemented — that is why they are
  # separate steps rather than one pytest invocation over tests/.
  # ---------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.tests == 'true'
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # PostGIS + H3 + TimescaleDB is a custom image, so it cannot be a
      # `services:` entry (those need a pre-built image from a registry). It is
      # built and run explicitly instead.
      #
      # This matters more than convenience: the leakage boundary and the
      # append-only audit constraint are enforced by *database privileges*.
      # Without a real database those tests do not run, and the gates that make
      # this project honest would be silently absent from CI.
      - name: Cache Postgres image layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: pg-${{ hashFiles('infra/docker/postgres/Dockerfile') }}

      - name: Build Postgres image
        run: docker compose build postgres

      - name: Start Postgres
        run: |
          docker compose up -d postgres
          for i in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U atlas -d atlas >/dev/null 2>&1; then
              echo "postgres ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::postgres did not become ready"; docker compose logs postgres; exit 1

      - run: pip install -e "apps/api[dev]"

      - name: Run migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Verify no schema drift
        working-directory: apps/api
        run: alembic check

      - name: Unit and integration
        run: pytest tests/unit tests/integration -q
      - name: Leakage gates (spec §19)
        run: pytest tests/leakage -q
      - name: Security suite
        run: pytest tests/security -q
      - name: Fairness — no protected attributes (spec §22.2)
        run: pytest tests/fairness -q

    env:
      ATLAS_DB_HOST: localhost
      ATLAS_DB_PORT: 55432
      ATLAS_DB_USER: atlas
      ATLAS_DB_PASSWORD: change-me-locally
      ATLAS_REDIS_URL: redis://localhost:6379/0
      # A skipped database test in CI is a broken pipeline, not a convenience.
      # Without this, the leakage and audit gates could silently vanish from a
      # green build.
      ATLAS_REQUIRE_DB: "1"

  # ---------------------------------------------------------------------
  # Gate 6: supply chain. Trivy always runs; CodeQL needs source.
  # ---------------------------------------------------------------------
  supply-chain:
    name: Dependency scan and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: SBOM
        uses: anchore/sbom-action@v0
        with: { format: cyclonedx-json, artifact-name: atlas-sbom.cdx.json }

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.python == 'true'
    permissions:
      contents: read
      security-events: write   # required to upload results; absence fails the job
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: python }
      - uses: github/codeql-action/analyze@v3
