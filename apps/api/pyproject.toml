[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-api"
version = "0.1.0"
description = "ATLAS — predictive cash-out intelligence for cybercrime complaints (SIH26184)"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "argon2-cffi>=23.1",          # password hashing (ADR-006)
  "pyjwt[crypto]>=2.10",        # tokens (ADR-006)
  # Imported directly for Ed25519 checkpoint signing (ADR-007). It arrives
  # transitively via pyjwt[crypto], but a direct import deserves a direct
  # declaration — otherwise a pyjwt change silently breaks the audit chain.
  "cryptography>=43.0",
  "pyotp>=2.9",                 # TOTP MFA
  "structlog>=24.4",            # structured JSON logs, no sensitive values
  "h3>=4.1",                    # prediction lattice (ADR-011)
  "shapely>=2.0",
  "geoalchemy2>=0.15",       # PostGIS column types for SQLAlchemy models
  "python-multipart>=0.0.17",
  # Imported directly for BaseHTTPMiddleware. It arrives transitively via
  # FastAPI, but a direct import deserves a direct declaration.
  "starlette>=0.41",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "xgboost>=2.1",
  "shap>=0.46",
  "lifelines>=0.30",            # discrete-time hazard for the predicted window
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=18.0",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.28",           # FastAPI TestClient
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",         # module boundaries (ADR-009)
  "types-redis",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "migrations"]

[tool.ruff.format]
# Alembic writes these. `ruff format` has no per-file-ignore mechanism (that is
# lint-only), so the exclusion belongs here to match the lint treatment below.
# Formatting generated output would otherwise have to be repeated by hand after
# every `alembic revision --autogenerate`, which is a footgun waiting to fire.
exclude = ["alembic/versions/*.py"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "B",           # bugbear
  "UP",          # pyupgrade
  "S",           # bandit — security lint matters here
  "ASYNC",
  "DTZ",         # naive datetimes are a bug in a temporal prediction system
  "T20",         # no print()
  "RET", "SIM", "PTH",
]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"simulator/**" = ["S311"]   # non-crypto RNG is correct for a simulator
# Alembic writes these files. Reformatting generated output by hand is churn and
# produces diffs that obscure the actual schema change under review.
"alembic/versions/*.py" = ["E501", "I001", "W291", "W293"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["h3.*", "shap.*", "lightgbm.*", "lifelines.*"]
ignore_missing_imports = true

# pytest configuration lives in the repo-root pytest.ini (tests/ is not under apps/api)
